backend="glx";
glx-no-stencil = true;

frame-opacity = 0.9;

corner-radius = 5;
fading = false;

blur: {
  method = "dual_kawase";
  strength = 7;
  background = true;
  kerne-size = 20;
}

fading = true;
fade-delta = 1;
fade-in-step = 1;
fade-out-step = 0.03;

animation = true;
animations = (
  {
    triggers = ["open"];
    preset = "appear";
    duration = 0.2;
  },
  {
    triggers = ["close"];
    preset = "disappear";
    duration = 0.2;
  }
)

shadow-exclude = [
  "class_g = 'Navigator'",
  "class_g = 'rofi'",
];

blur-background-exclude = [
  "class_g = 'Navigator'",
  "class_g = 'rofi'",
];

rounded-corners-exclude = [
  "class_g = 'Polybar'",
];
