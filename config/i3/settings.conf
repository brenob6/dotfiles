focus_follows_mouse no
smart_borders on

for_window [class="Spotify"] move to workspace 10
for_window [class="Evince"] layout tabbed
for_window [class="flameshot"] floating enable, border none

assign [class="discord"] 9

gaps inner 6

# Solarized window colors
# class                 border  bg      text    indicator child_border
client.focused          #268bd2 #268bd2 #002b36 #2aa198   #268bd2
client.focused_inactive #073642 #073642 #839496 #073642   #073642
client.unfocused        #002b36 #002b36 #586e75 #002b36   #002b36
client.urgent           #dc322f #dc322f #fdf6e3 #dc322f   #dc322f

# Disable CapsLk
exec --no-startup-id 'setxkbmap -option "caps:menu"'
